name: talent-flow-ats

services:
  backend:
    container_name: talent-flow-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4000:4000"
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: talent_flow_ats
      DB_USER: postgres
      DB_PASSWORD: Pass2020NothingSpecial
      SECRET_KEY: supersecretkey1234567890123456789032
      HF_TOKEN: ${HF_TOKEN}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: Asia/Kolkata
    volumes:
      - ./backend:/backend
      - .env:/backend/.env:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # 6 Async workers (Handles 250-300 concurrent candidates)
    command: gunicorn app.main:app -w 6 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:4000 --timeout 120 --graceful-timeout 30 --max-requests 1000 --max-requests-jitter 100

  frontend:
    container_name: talent-flow-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser client API URL
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-prod}
        NEXT_PUBLIC_ENABLE_AI_QUESTION_GENERATOR: ${NEXT_PUBLIC_ENABLE_AI_QUESTION_GENERATOR:-false}
    environment:
      # Internal SSR backend URL
      BACKEND_URL: http://backend:4000
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - backend

  migrations:
    image: talent-flow-ats-backend
    profiles: ["migrate"]
    volumes:
      - ./backend:/backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: talent_flow_ats
      DB_USER: postgres
      DB_PASSWORD: Pass2020NothingSpecial
    # Normalize CRLF -> LF at runtime, then execute the script.
    entrypoint:
      [
        "sh",
        "-c",
        "tr -d '\\r' < /backend/scripts/run_migrations.sh > /tmp/run_migrations.sh && exec sh /tmp/run_migrations.sh \"$@\"",
        "--",
      ]
    command: ["upgrade", "head"]

  pgbouncer:
    container_name: talent-flow-pgbouncer
    image: edoburu/pgbouncer:latest
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: Pass2020NothingSpecial
      DB_NAME: talent_flow_ats
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      AUTH_TYPE: scram-sha-256
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: talent-flow-postgres
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: talent_flow_ats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Pass2020NothingSpecial
    ports:
      - "9600:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Optimized Postgres settings (1.5GB buffer + dynamic OS cache)
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=1536MB
      -c effective_cache_size=6GB
      -c work_mem=6MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5

  redis:
    container_name: talent-flow-redis
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  backup-logs:
    container_name: talent-flow-backup-logs
    image: busybox
    restart: always
    volumes:
      - ./backend/backups:/backups:ro
    command: tail -F /backups/backup.log

volumes:
  postgres_data:
